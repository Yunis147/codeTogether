# Local Judge0 CE configuration. These values are intentionally limited for
# development; change the passwords and token before exposing the runner.
RAILS_ENV=production
JUDGE0_TELEMETRY_ENABLE=false
ENABLE_WAIT_RESULT=true
ENABLE_ADDITIONAL_FILES=true
ENABLE_NETWORK=false
CPU_TIME_LIMIT=2
WALL_TIME_LIMIT=5
MAX_EXTRACT_SIZE=2048
MAX_FILE_SIZE=1024
POSTGRES_HOST=judge0-db
POSTGRES_DB=judge0
POSTGRES_USER=judge0
POSTGRES_PASSWORD=codetogether-judge0-db
REDIS_HOST=judge0-redis
REDIS_PASSWORD=codetogether-judge0-redis
AUTHN_HEADER=X-Auth-Token
AUTHN_TOKEN=codetogether-local-runner-token
