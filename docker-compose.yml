services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: codetogether
      POSTGRES_PASSWORD: codetogether
      POSTGRES_DB: codetogether
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codetogether -d codetogether"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres_data:
